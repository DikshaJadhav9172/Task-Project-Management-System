name: Task Management CI/CD

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:

  frontend-build:
    name: Frontend Build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 18

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm install

      - name: Build frontend
        working-directory: frontend
        run: npm run build
        env:
          VITE_API_URL: ${{ secrets.VITE_API_URL }}


  backend-check:
    name: Backend Check
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 18

      - name: Install backend dependencies
        working-directory: backend
        run: npm install

      - name: Check backend syntax
        working-directory: backend
        run: node --check server.js


  docker-build:
    name: Docker Build
    runs-on: ubuntu-latest

    needs:
      - frontend-build
      - backend-check

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Build Docker image
        run: |
          docker build \
            --progress=plain \
            --build-arg VITE_API_URL="${{ secrets.VITE_API_URL }}" \
            -t task-management:${{ github.sha }} .


  production-check:
    name: Production Check
    runs-on: ubuntu-latest

    needs:
      - docker-build

    if: github.event_name == 'push' && github.ref == 'refs/heads/main'

    steps:
      - name: Wait for Render deployment
        run: sleep 30

      - name: Check production application
        run: |
          curl -f --retry 5 --retry-delay 10 \
          https://task-and-project-management-system.onrender.com
