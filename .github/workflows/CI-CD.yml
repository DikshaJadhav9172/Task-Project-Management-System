name: Task Management CI/CD

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:

  # ==========================================
  # 1. FRONTEND BUILD
  # ==========================================
  frontend-build:
    name: 1 - Frontend Build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 18

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm install

      - name: Build frontend
        working-directory: frontend
        run: npm run build
        env:
          VITE_API_URL: ${{ secrets.VITE_API_URL }}


  # ==========================================
  # 2. BACKEND CHECK
  # ==========================================
  backend-check:
    name: 2 - Backend Check
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 18

      - name: Install backend dependencies
        working-directory: backend
        run: npm install

      - name: Check backend syntax
        working-directory: backend
        run: node --check server.js


  # ==========================================
  # 3. DOCKER BUILD
  # ==========================================
  docker-build:
    name: 3 - Docker Build
    runs-on: ubuntu-latest

    needs:
      - frontend-build
      - backend-check

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Build Docker image
        run: |
          docker build \
            --progress=plain \
            --build-arg VITE_API_URL="${{ secrets.VITE_API_URL }}" \
            -t task-management:${{ github.sha }} .


  # ==========================================
  # 4. DEPLOY TO RENDER
  # ==========================================
  deploy:
    name: 4 - Deploy to Render
    runs-on: ubuntu-latest

    needs:
      - docker-build

    if: github.event_name == 'push' && github.ref == 'refs/heads/main'

    steps:
      - name: Trigger Render deployment
        run: |
          curl -f -X POST "${{ secrets.RENDER_DEPLOY_HOOK }}"


  # ==========================================
  # 5. PRODUCTION CHECK
  # ==========================================
  production-check:
    name: 5 - Production Check
    runs-on: ubuntu-latest

    needs:
      - deploy

    if: github.event_name == 'push' && github.ref == 'refs/heads/main'

    steps:
      - name: Wait for Render deployment
        run: sleep 60

      - name: Check production application
        run: |
          curl -f --retry 10 --retry-delay 15 \
          https://task-and-project-management-system.onrender.com
