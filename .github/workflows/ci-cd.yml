name: Task Management CI/CD

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:

  frontend-build:
    name: Frontend Build
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: frontend

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 18
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        run: npm ci

      - name: Build frontend
        run: npm run build
        env:
          VITE_API_URL: ${{ secrets.VITE_API_URL }}

      - name: Security audit
        run: npm audit --audit-level=high || true


  backend-check:
    name: Backend Check
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: backend

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 18
          cache: npm
          cache-dependency-path: backend/package-lock.json

      - name: Install backend dependencies
        run: npm ci

      - name: Security audit
        run: npm audit --audit-level=high || true

      - name: Check backend syntax
        run: node --check server.js


  docker-build:
    name: Docker Build
    runs-on: ubuntu-latest

    needs:
      - frontend-build
      - backend-check

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Build Docker image
        run: |
          docker build \
            --build-arg VITE_API_URL=${{ secrets.VITE_API_URL }} \
            -t task-management:${{ github.sha }} .


  deploy:
    name: Deploy to Render
    runs-on: ubuntu-latest

    needs:
      - docker-build

    if: github.ref == 'refs/heads/main'

    steps:
      - name: Trigger Render deployment
        run: |
          curl -f -X POST "${{ secrets.RENDER_DEPLOY_HOOK }}"


  smoke-test:
    name: Production Smoke Test
    runs-on: ubuntu-latest

    needs:
      - deploy

    if: github.ref == 'refs/heads/main'

    steps:
      - name: Check deployed application
        run: |
          curl -f https://task-and-project-management-system.onrender.com
